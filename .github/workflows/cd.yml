name: cd

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pygwin and Nuitka
        run: |
          pip install -e ".[full]"
          pip install nuitka zstandard

      - name: Pre-build parser tables
        # Without this, Nuitka bundles no tables at all, and every person
        # who downloads the release eats a one-time ~1.8s LALR
        # table-generation hang the first time they run any command. See
        # scripts/build_parser_tables.py for why.
        run: python scripts/build_parser_tables.py

      - name: Determine version
        id: version
        run: |
          $version = python -c "import pygwin; print(pygwin.__version__)"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build standalone executable
        run: >
          python -m nuitka
          --onefile
          --onefile-cache-mode=cached
          --standalone
          --output-filename=pygwin.exe
          --output-dir=dist
          --assume-yes-for-downloads
          --enable-plugin=no-qt
          --windows-console-mode=force
          --no-deployment-flag=self-execution
          --company-name=pygwin
          --product-name=pygwin
          --file-description="pygwin: a Windows-first, Python-powered shell"
          --product-version=${{ steps.version.outputs.version }}
          --file-version=${{ steps.version.outputs.version }}
          --include-module=pygwin.parser_table
          --include-module=pygwin.completion_parser_table
          --include-package=pgtrib
          --include-package=pgcompletions
          pygwin/__main__.py

      - uses: actions/upload-artifact@v4
        with:
          name: pygwin-windows-exe
          path: dist/pygwin.exe

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/pygwin.exe
          generate_release_notes: true
