[build-system]
# PEP 518 https://www.python.org/dev/peps/pep-0518/
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# PEP 621 project metadata
# See https://www.python.org/dev/peps/pep-0621/
name = "pygwin"
dynamic = ["version", "readme"]
description = "A Windows-first, Python-powered shell and system observability console. A fork of xonsh."
authors = [{ name = "Dominick", email = "dommcpro@gmail.com" }]
maintainers = [{ name = "Dominick", email = "dommcpro@gmail.com" }]
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
    # Windows ships no stdlib readline module at all. Since readline is
    # pygwin's default interactive backend (not prompt_toolkit, kept
    # strictly opt-in for startup-time reasons), a Windows install needs a
    # real readline implementation out of the box, not as an opt-in extra
    # the way upstream xonsh treats it: without this, the default shell on
    # this project's primary platform degrades to no line editing at all.
    "pyreadline3; platform_system=='Windows'",
]

[tool.setuptools.dynamic]
version = {attr = "pygwin.__version__"}
readme = {file = ["README.md"], content-type = "text/markdown"}

[tool.setuptools]
packages = [
    "pygwin",
    "pygwin.api",
    "pygwin.checker",
    "pygwin.linter",
    "pygwin.shells",
    "pygwin.shells.ptk_shell",
    "pygwin.parsers.ply",
    "pygwin.procs",
    "pygwin.platforms",
    "pygwin.parsers",
    "pygwin.xoreutils",
    "xontrib",
    "pygwin.completers",
    "pygwin.history",
    "pygwin.prompt",
    "pygwin.pytest",
    "pygwin.lib",
    "pygwin.webconfig",
    "pygwin.virtualenv",
    "pygwin.formatter",
    "xompletions",
]
platforms = ["Cross Platform"]
include-package-data = false

[tool.setuptools.package-dir]
pygwin = "pygwin"
xontrib = "xontrib"
xompletions = "xompletions"
"pygwin.lib" = "pygwin/lib"
"pygwin.webconfig" = "pygwin/webconfig"

[tool.setuptools.package-data]
pygwin = [
    "*.json",
    "*.githash",
]
xontrib = ["*.xsh"]
"pygwin.lib" = ["*.xsh"]
"pygwin.virtualenv" = ["*.xsh"]
"pygwin.webconfig" = [
    "*.html",
    "js/app.min.js",
    "js/bootstrap.min.css",
    "js/LICENSE-bootstrap",
]

[project.entry-points]
pytest11 = { pygwin = "pygwin.pytest.plugin" }

[project.entry-points."pygments.lexers"]
pygwin = "pygwin.pyghooks:PygwinLexer"
pygwincon = "pygwin.pyghooks:PygwinConsoleLexer"

[project.entry-points."virtualenv.activate"]
pygwin = "pygwin.virtualenv:PygwinActivator"

[project.urls]
Homepage = "https://dayanez.github.io/pygwin/"
repository = "https://github.com/dayanez/pygwin"
changelog = "https://github.com/dayanez/pygwin/blob/main/CHANGELOG.md"
"Issue tracker" = "https://github.com/dayanez/pygwin/issues"
"Upstream (xonsh)" = "https://github.com/xonsh/xonsh"

[project.optional-dependencies]
ptk = [
    "prompt-toolkit>=3.0.29",
    "pyperclip",
]
pygments = ["pygments>=2.2"]
mac = ["gnureadline"]
linux = ["distro"]
proctitle = ["setproctitle"]
observability = ["psutil>=5.9"]
full = [
    "pygwin[ptk,pygments,observability]",
    "distro; platform_system=='Linux'",
    "setproctitle; platform_system=='Windows'",
    "gnureadline; platform_system=='Darwin'",
    "ujson",
    "click",
]
bestshell = [
    "prompt-toolkit>=3.0.29",
    "pygments>=2.2",
]
test = [
    "pygwin[bestshell,observability]",
    "pytest>=7",
    "restructuredtext_lint",
    "pytest-cov",
    "pytest-mock",
    "pytest-timeout",
    "pytest-subprocess",
    "pytest-rerunfailures",
    "prompt-toolkit>=3.0.29",
    "pygments>=2.2",
    "coverage>=5.3.1",
    "pyte>=0.8.0",
    "virtualenv>=20.16.2",
    "requests",
]
dev = [
    "pygwin[test,doc]",
    "pre-commit",
    "re-ver",
    "tomli",
]
doc = [
    "pygwin[bestshell]",
    "furo",
    "numpydoc",
    "sphinx>=3.1",
    "psutil",
    "pyzmq",
    "matplotlib",
    "tornado",
    "myst-parser",
    "sphinx-autobuild",
    "sphinx-prompt",
    "sphinx-reredirects",
    "sphinx-sitemap",
]



[project.scripts]
pygwin = "pygwin.main:main"
pygwin-cat = "pygwin.xoreutils.cat:main"
pygwin-uname = "pygwin.xoreutils.uname:main"
pygwin-uptime = "pygwin.xoreutils.uptime:main"


[tool.ruff.lint.isort]
known-first-party = ["pygwin", "xontrib", "xompletions", "tests"]
known-third-party = ["ply", "pytest"]

[tool.ruff]
src = [
    "pygwin", "xontrib", "xompletions", "tests"
]
extend-exclude = [
    "docs/",
    "*/ply/",
    "parser*_table.py",
    "completion_parser_table.py",
    "build/",
    "dist/",
    "setup.py",
    ".vscode/",
    "feedstock",
    "rever",
    ".venv*/",
    ".local.out*/",
]
line-length = 88

[tool.ruff.per-file-target-version]
"pygwin/parsers/v310.py" = "py310"
"pygwin/parsers/v313.py" = "py313"

[tool.ruff.lint]
ignore = [
    "D100", # Missing docstring in public module
    "D101", # Missing docstring in public class
    "D102", # Missing docstring in public method
    "D103", # Missing docstring in public function
    "D104", # Missing docstring in public package
    "D105", # Missing docstring in magic method
    "D200", # One-line docstring should fit on one line with quotes
    "D202", # No blank lines allowed after function docstring
    "D205", # 1 blank line required between summary line and description
    "D207", # Docstring is under-indented
    "D208", # Docstring is over-indented
    "D209", # Multi-line docstring closing quotes should be on a separate line
    "D210", # No whitespaces allowed surrounding docstring text
    "D301", # Use r""" if any backslashes in a docstring
    "D400", # First line should end with a period
    "D401", # First line should be in imperative mood
    "D403", # First word of the first line should be properly capitalized
    "D404", # First word of the docstring should not be This
    "D406", # Section name should end with a newline
    "D407", # Missing dashed underline after section
    "D409", # Section underline should be in the line following the section’s name
    "D411", # Missing blank line before section
    "D418", # Function decorated with `@overload` shouldn't contain a docstring
    "E402", # Module level import not at top of file
    "E501", # line length
    "E731", # Do not assign a lambda expression, use a def
    "UP031", # Use format specifiers instead of percent format
]
select = [
    "B", # https://beta.ruff.rs/docs/rules/#flake8-bugbear-b
    "D", # https://beta.ruff.rs/docs/rules/#pydocstyle-d
    "E", # https://beta.ruff.rs/docs/rules/#pycodestyle-e-w
    "F", # https://beta.ruff.rs/docs/rules/#pyflakes-f
    "I", # https://beta.ruff.rs/docs/rules/#isort-i
    "T10", # https://beta.ruff.rs/docs/rules/#flake8-debugger-t10
    "TID", # https://docs.astral.sh/ruff/rules/#flake8-tidy-imports-tid
    "YTT", # https://beta.ruff.rs/docs/rules/#flake8-2020-ytt
    "W", # https://beta.ruff.rs/docs/rules/#pycodestyle-e-w
    "UP", # https://beta.ruff.rs/docs/rules/#pyupgrade-up
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"pygwin/timings.py" = ["F401"]
"pygwin/history.py" = ["F821"]
"pygwin/parsers/lexer.py" = ["E741"]
"pygwin/parsers/completion_context.py" = ["B018"]
"pygwin/parsers/tokenize.py" = [
    "F821",
    "F841",
    "B904" # Within an `except` clause, raise exceptions with `raise ... from err`
]
"pygwin/pyghooks.py" = ["F821"]
"tests/test_builtins.py" = [
    "F821",
    "B011",
]
"pygwin/built_ins.py" = [
    "F821",
    "E721",
    "E721",
]
"pygwin/style_tools.py" = ["F821"]
"pygwin/xoreutils/*.py" = ["E722"]
"pygwin/completers/python.py" = ["E722"]
"pygwin/parsers/ast.py" = ["F401"]
"pygwin/shells/ptk_shell/__init__.py" = ["E731"]
"pygwin/shells/readline_shell.py" = ["F401"]
"pygwin/commands_cache.py" = ["F841"]
"pygwin/shells/ptk_shell/key_bindings.py" = ["F841"]
"pygwin/tools.py" = [
    "E731",
]
"pygwin/xonfig.py" = ["E731"]
"xontrib/vox.py" = ["F821"]
"pygwin/inspectors.py" = ["E722"]
"pygwin/platform_info.py" = ["F401"]
"pygwin/parsers/*.py" = [
    "E741", # E741 Ambiguous variable name
]
"tests/test*.py" = [
    "E741", #  E741 Ambiguous variable name
]

[dependency-groups]
dev = [
    "pygwin[dev]",
]
